<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>BarberPro</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0b0e12;
        color: #f8f8fa;
        font-family: system-ui, -apple-system, sans-serif;
        text-align: center;
        padding: 24px;
      }
      .card {
        max-width: 360px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 18px;
        background: #141920;
        padding: 28px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 22px;
        letter-spacing: 0.14em;
      }
      h1 span {
        color: #f5b51b;
      }
      p {
        margin: 0;
        color: #a0a9b6;
        font-size: 14px;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>BARBER<span>PRO</span></h1>
      <p>Conectando ao servidor seguro da barbearia. Verifique sua conexão com a internet caso o aplicativo não carregue.</p>
    </div>
  </body>
</html>
